<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1c2740"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <text x="72" y="150" font-size="76" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Консилиум</text>
  <text x="74" y="205" font-size="30" fill="#cbd5e1">состязательный мультиагентный разбор</text>
  <text x="74" y="262" font-size="20" fill="#94a3b8">независимые агенты · обязательный скептик · реестр ограничений</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M880 180 L968 80"/><path d="M880 180 L968 145"/><path d="M880 180 L968 210"/><path d="M880 180 L968 275"/>
    <path d="M1012 80 L1100 180"/><path d="M1012 145 L1100 180"/><path d="M1012 210 L1100 180"/><path d="M1012 275 L1100 180"/>
  </g>

  <rect x="770" y="150" width="110" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="825" y="187" font-size="20" fill="#e2e8f0" text-anchor="middle">досье</text>

  <text x="990" y="44" font-size="16" fill="#64748b" text-anchor="middle">специалисты</text>
  <g fill="#0f172a" stroke="#60a5fa" stroke-width="2.5">
    <circle cx="990" cy="80" r="22"/><circle cx="990" cy="145" r="22"/><circle cx="990" cy="210" r="22"/><circle cx="990" cy="275" r="22"/>
  </g>
  <g font-size="18" fill="#93c5fd" text-anchor="middle">
    <text x="990" y="86">1</text><text x="990" y="151">2</text><text x="990" y="216">3</text><text x="990" y="281">4</text>
  </g>

  <rect x="1100" y="150" width="120" height="60" rx="12" fill="#172a46" stroke="#60a5fa" stroke-width="2"/>
  <text x="1160" y="187" font-size="20" fill="#e2e8f0" text-anchor="middle">итог</text>

  <path d="M1160 266 L1160 218" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <circle cx="1160" cy="290" r="24" fill="#f97316"/>
  <text x="1160" y="342" font-size="16" fill="#fdba74" text-anchor="middle">скептик</text>
